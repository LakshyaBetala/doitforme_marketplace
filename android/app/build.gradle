apply plugin: 'com.android.application'

// Release signing, read from a file that is NOT in git.
//
// Play Store will not accept a debug-signed build, and the upload key is the
// one secret in this project that cannot be rotated: Google pins the app id to
// its signature, so losing it means the listing can never be updated again and
// a new one has to be published under a different id. It therefore does not go
// in the repo, is not generated by any script here, and the password is not
// written down by anything automated.
//
// Create it once, keep the file and both passwords in a password manager, then
// write android/keystore.properties (gitignored) with:
//
//   storeFile=C:/path/to/doitforme-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
//
// Generate the key with (JDK 21 from Android Studio, see docs/APP.md):
//
//   keytool -genkeypair -v -keystore doitforme-upload.jks \
//     -keyalg RSA -keysize 2048 -validity 10000 -alias upload
//
// With no properties file present the release build still COMPILES but comes
// out unsigned, which fails at upload rather than silently shipping something
// signed with a throwaway key.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "in.doitforme.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.doitforme.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps.containsKey("storeFile")) {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            // Only attached when a keystore was actually configured. Assigning
            // it unconditionally makes Gradle fail the whole build with a null
            // storeFile, which reads as a broken project rather than a missing
            // credential.
            if (keystoreProps.containsKey("storeFile")) {
                signingConfig signingConfigs.release
            }
            // Left off deliberately. This app is a WebView around the live
            // site (see capacitor.config.ts): there is no app-side business
            // logic for R8 to shrink or obfuscate, so enabling it costs build
            // time and a class of crash-only-in-release bugs in exchange for
            // nothing.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
