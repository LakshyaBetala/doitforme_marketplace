name: Deploy to Cloudflare

# Auto-deploy on push to main. Manual dispatch is kept so a deploy can be
# forced without an empty commit — useful when only a Worker secret changed.
#
# WHY NOT CLOUDFLARE WORKERS BUILDS: the dashboard's built-in Git integration
# does the same job, but it cannot run this repo's test suite first. Escrow
# money movement is covered by tests that talk to the real database
# (npm run test:escrow), and shipping a release that has not passed them is the
# failure mode worth spending a minute of CI on.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Deploy without running tests (emergencies only)"
        type: boolean
        default: false

concurrency:
  # Never let two deploys race onto the same Worker.
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Wrangler hard-refuses Node 20. 24 is what the migration was built on.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        if: ${{ !inputs.skip_tests }}
        run: npm run test:unit

      # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they
      # have to be present here — setting them as Worker secrets does nothing
      # for them. They are `vars`, not `secrets`, because they ship inside every
      # page load and calling them secret would be a lie.
      #
      # Runtime secrets (SUPABASE_SERVICE_ROLE_KEY, RAZORPAY_KEY_SECRET, ...)
      # are deliberately absent: they already live on the Worker via
      # `wrangler secret put`, and a deploy does not clear them.
      - name: Build and deploy the app Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy

      # Separate Worker, separate deploy. It changes rarely, but keeping it in
      # the same pipeline stops the schedules drifting from the routes they call.
      - name: Deploy the cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/cron/wrangler.jsonc

      # A deploy that returns 200 on the homepage but 500 everywhere behind the
      # login is still a bad deploy. This checks the shape of the surface, not
      # just that something answered.
      - name: Smoke test the deployment
        env:
          BASE: ${{ vars.DEPLOY_SMOKE_URL || 'https://doitforme1.doitforme.workers.dev' }}
        run: |
          node -e '
            const B = process.env.BASE;
            const expect = [
              ["/", 200], ["/talent", 200], ["/login", 200],
              ["/dashboard", 307], ["/activity", 307],
              ["/api/cron/auto-release", 401], ["/api/admin/payouts", 401],
            ];
            (async () => {
              let bad = 0;
              for (const [path, want] of expect) {
                const r = await fetch(B + path, { redirect: "manual" });
                const ok = r.status === want;
                if (!ok) bad++;
                console.log(`  ${ok ? "ok  " : "FAIL"} ${path} -> ${r.status} (want ${want})`);
              }
              if (bad) { console.error(`\n${bad} route(s) wrong. Deploy is live but suspect.`); process.exit(1); }
              console.log("\nSmoke test passed.");
            })();
          '
